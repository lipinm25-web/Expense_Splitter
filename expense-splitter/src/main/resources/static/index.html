<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Splitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Expense Splitter</h1>

<section id="user-section">
    <h2>Add User</h2>
    <input type="text" id="user-name" placeholder="Name">
    <input type="email" id="user-email" placeholder="Email">
    <button id="add-user-btn">Add User</button>
    <ul id="user-list"></ul>
</section>

<section id="group-section">
    <h2>Create Group</h2>
    <input type="text" id="group-name" placeholder="Group name">
    <div id="group-member-checkboxes"></div>
    <button id="create-group-btn">Create Group</button>
    <ul id="group-list"></ul>
</section>

<section id="expense-section">
    <h2>Add Expense</h2>
    <select id="expense-group-select"></select>
    <input type="text" id="expense-description" placeholder="Description">
    <input type="number" id="expense-amount" placeholder="Amount (₹)" step="0.01">
    <select id="expense-payer-select"></select>
    <div id="expense-split-checkboxes"></div>
    <button id="add-expense-btn">Add Expense</button>
</section>

<section id="balance-section">
    <h2>Balances & Settlement Plan</h2>
    <select id="balance-group-select"></select>
    <button id="view-balances-btn">View Balances</button>
    <div id="balance-results"></div>
    <div id="settlement-results"></div>
</section>

<script src="app.js"></script>
</body>
</html>
